name: Phase 11.4 Next Security Upgrade

on:
  push:
    branches:
      - phase-11-3-search-authority
    paths:
      - .github/workflows/phase-11-4-next-security-upgrade.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  upgrade-next:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase-11-3-search-authority

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install patched Next.js release
        run: npm install --save-exact next@16.3.3 eslint-config-next@16.3.3

      - name: Validate Phase 11.4 search architecture
        run: npm run qa:search

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit patched dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: upgrade Next.js to 16.3.3"
          git push origin HEAD:phase-11-3-search-authority
