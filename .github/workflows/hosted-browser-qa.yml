name: CYA Hosted Browser QA

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cya-production-application-02

concurrency:
  group: cya-hosted-browser-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hosted-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_PREVIEW_URL: https://cya-website-prototype-git-feat-cya-production-a-64f3ae-artifact.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Check whether protected-preview QA is configured
        id: guard
        shell: bash
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured. Hosted browser QA is intentionally skipped."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Protected-preview browser QA is configured."
          fi

      - name: Check out repository
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Install Playwright for hosted qualification
        if: steps.guard.outputs.ready == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run hosted browser qualification
        if: steps.guard.outputs.ready == 'true'
        run: node scripts/hosted-browser-qa.mjs

      - name: Upload browser QA evidence
        if: always() && steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cya-hosted-browser-qa
          path: artifacts/hosted-browser-qa
          if-no-files-found: warn
          retention-days: 14
