name: Phase 11.4 Production QA

on:
  push:
    branches:
      - phase-11-3-search-authority
  pull_request:
    branches:
      - feature/cya-prototype-v1

permissions:
  contents: read

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Phase 11.4 search architecture
        run: npm run qa:search

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
