name: Phase 11.4 Production Dependency Audit Fix

on:
  push:
    branches:
      - phase-11-3-search-authority
    paths:
      - .github/workflows/phase-11-4-production-audit-fix.yml

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase-11-3-search-authority

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible production audit fixes
        run: npm audit fix --omit=dev

      - name: Restore development dependencies from updated lockfile
        run: npm ci

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Phase 11.4 search architecture
        run: npm run qa:search

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit regenerated dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: resolve production dependency audit findings"
          git push origin HEAD:phase-11-3-search-authority
